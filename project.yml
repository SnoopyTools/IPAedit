name: IPAedit
options:
  bundleIdPrefix: com.snoopytools
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  IPAedit:
    type: application
    platform: iOS
    sources:
      - path: IPAedit
        excludes:
          - Info.plist
      # Capstone (ARM64 only), compiled from source. Headers are found through
      # per-file flags so its generic header names can't shadow system ones.
      - path: Vendor/capstone
        includes:
          - "*.c"
          - "**/*.c"
        compilerFlags:
          - "-DCAPSTONE_HAS_ARM64"
          - "-DCAPSTONE_USE_SYS_DYN_MEM"
          - "-I$(SRCROOT)/Vendor/capstone/include"
          - "-w"
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: IPAedit
        PRODUCT_BUNDLE_IDENTIFIER: com.snoopytools.ipaedit
        INFOPLIST_FILE: IPAedit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: IPAedit/Bridge/IPAedit-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
