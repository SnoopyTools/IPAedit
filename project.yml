name: IPAedit
options:
  bundleIdPrefix: com.snoopytools
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  IPAedit:
    type: application
    platform: iOS
    sources:
      - path: IPAedit
        excludes:
          - Info.plist
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: IPAedit
        PRODUCT_BUNDLE_IDENTIFIER: com.snoopytools.ipaedit
        INFOPLIST_FILE: IPAedit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
